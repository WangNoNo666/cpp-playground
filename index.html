<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++20 在线编译器</title>
<link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='0.9em'%20font-size='90'%3E%F0%9F%92%BB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#1e1e1e; --bg2:#252526; --bg3:#2d2d30; --border:#3c3c3c;
  --fg:#d4d4d4; --fg2:#9d9d9d; --acc:#0e639c; --acc2:#1177bb;
  --green:#6fd95f; --red:#ff5a6e; --yellow:#f0c040;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  user-select:none;-webkit-user-select:none;}
textarea,pre,input,select{user-select:text;-webkit-user-select:text;}
/* ---- 标签栏（VS Code 风格） ---- */
#tabbar{display:flex;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--border);height:36px;}
#tabs{display:flex;flex:1;overflow-x:auto;scrollbar-width:thin;}
.tab{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg3);color:var(--fg2);
  border-right:1px solid var(--border);cursor:pointer;font-size:13px;white-space:nowrap;max-width:200px;min-width:90px;}
.tab .tname{overflow:hidden;text-overflow:ellipsis;}
.tab.active{background:var(--bg);color:var(--fg);box-shadow:inset 0 2px 0 var(--acc2);}
.tab .x{color:var(--fg2);border-radius:3px;padding:0 4px;font-size:11px;line-height:18px;}
.tab .x:hover{background:rgba(255,255,255,.15);color:#fff;}
.tab .dot{width:7px;height:7px;border-radius:50%;background:transparent;}
.tab.dirty .dot{background:var(--yellow);}
#tabbarBtns{display:flex;align-items:center;gap:6px;padding:0 10px;}
.iconBtn{background:var(--bg3);border:1px solid var(--border);color:var(--fg);border-radius:5px;
  cursor:pointer;font-size:14px;width:28px;height:26px;line-height:1;}
.iconBtn:hover{background:var(--acc);}
#runBtn{background:linear-gradient(135deg,#2ea043,#238636);border:none;color:#fff;border-radius:5px;
  padding:5px 14px;font-size:13px;cursor:pointer;font-weight:bold;}
#runBtn:hover{filter:brightness(1.15);}
#runBtn:disabled{opacity:.5;cursor:wait;}
/* ---- 主区 ---- */
#main{display:flex;height:calc(100% - 36px - 200px);min-height:200px;}
#editorWrap{flex:1;position:relative;overflow:hidden;background:var(--bg);}
#editor{position:absolute;inset:0;}
#editor .cm-editor{height:100%;}
#editor .cm-scroller{overflow:auto;font-family:'Cascadia Code',Consolas,'JetBrains Mono',monospace;font-size:14px;}
#editor .cm-gutters{background:var(--bg2);border-right:1px solid var(--border);}
#editor .cm-activeLine{background:rgba(255,255,255,.04);}
#editor .cm-activeLineGutter{background:rgba(255,255,255,.06);}
/* ---- 测试用例面板 ---- */
#sidePanel{width:330px;min-width:240px;background:var(--bg2);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;}
#sideHead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;}
#sideHead b{color:var(--fg);}
#sideHead .hint{font-size:11px;color:var(--fg2);}
#fetchRow{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);}
#fetchUrl{flex:1;background:#1a1a1a;color:var(--fg);border:1px solid var(--border);border-radius:5px;
  padding:5px 8px;font-size:12px;outline:none;min-width:0;}
#fetchUrl:focus{border-color:var(--acc2);}
#fetchBtn{background:var(--acc);border:none;color:#fff;border-radius:5px;padding:5px 12px;font-size:12px;cursor:pointer;}
#fetchBtn:hover{background:var(--acc2);}
#fetchBtn:disabled{opacity:.5;cursor:wait;}
#caseList{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
.caseBox{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px;flex:0 0 auto;}
.caseHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:6px;}
.caseHead .cname{font-size:12px;color:var(--fg2);}
.caseHead .res{font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;background:var(--bg2);white-space:nowrap;}
.res.pass{color:var(--green);} .res.fail{color:var(--red);} .res.run{color:var(--yellow);} .res.tle{color:var(--yellow);}
.caseBox label{display:block;font-size:11px;color:var(--fg2);margin:4px 0 2px;}
.caseBox .inpRow{display:flex;gap:4px;align-items:center;}
.caseBox textarea{width:100%;height:56px;background:#1a1a1a;color:var(--fg);border:1px solid var(--border);
  border-radius:5px;padding:6px;font-family:Consolas,monospace;font-size:12px;resize:vertical;outline:none;}
.caseBox textarea:focus{border-color:var(--acc2);}
.upBtn{background:var(--bg2);border:1px solid var(--border);color:var(--fg2);border-radius:4px;
  padding:2px 6px;font-size:11px;cursor:pointer;white-space:nowrap;}
.upBtn:hover{color:var(--fg);border-color:var(--acc2);}
.caseBox .actual{display:none;background:#121212;border:1px solid var(--border);border-radius:5px;
  padding:6px;font-family:Consolas,monospace;font-size:11px;color:#c8d8c8;white-space:pre-wrap;max-height:120px;overflow:auto;margin-top:4px;}
.caseBox .actual.show{display:block;}
.delCase{background:none;border:none;color:var(--fg2);cursor:pointer;font-size:13px;}
.delCase:hover{color:var(--red);}
#addCaseBtn{background:var(--bg3);border:1px dashed var(--border);color:var(--fg2);border-radius:6px;
  padding:6px;cursor:pointer;font-size:12px;width:100%;}
#addCaseBtn:hover{color:var(--fg);border-color:var(--acc2);}
/* ---- 输出面板 ---- */
#outputPanel{height:200px;background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-direction:column;}
#outTabs{display:flex;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--border);}
.ot{padding:5px 14px;font-size:12px;color:var(--fg2);cursor:pointer;border-radius:6px 6px 0 0;}
.ot.active{background:var(--bg);color:var(--fg);}
#outBody{flex:1;overflow:auto;background:var(--bg);}
.out{display:none;white-space:pre-wrap;font-family:Consolas,monospace;font-size:13px;line-height:1.55;
  padding:10px 14px;color:var(--fg);user-select:text;}
.out.show{display:block;}
.out.err{color:#ff9aa8;}
#customInput{display:none;width:100%;height:100%;background:var(--bg);color:var(--fg);border:none;
  padding:10px 14px;font-family:Consolas,monospace;font-size:13px;resize:none;outline:none;}
#customInput.show{display:block;}
/* ---- 状态栏 ---- */
#statusbar{display:flex;align-items:center;gap:10px;height:30px;background:var(--acc);
  color:#fff;font-size:12px;padding:0 12px;overflow:hidden;white-space:nowrap;}
#statusbar select{background:rgba(0,0,0,.25);border:none;color:#fff;border-radius:4px;padding:2px 6px;font-size:12px;outline:none;}
#statusbar input{background:rgba(0,0,0,.25);border:none;color:#fff;border-radius:4px;padding:2px 6px;font-size:12px;outline:none;width:130px;}
#timeLimit{width:72px !important;}
#statusText{flex:1;overflow:hidden;text-overflow:ellipsis;}
#shortcutHint{color:rgba(255,255,255,.8);font-size:11px;}
#memText{cursor:help;border-bottom:1px dotted rgba(255,255,255,.5);}
/* ---- 拖拽提示 ---- */
#dropHint{position:fixed;inset:0;background:rgba(14,99,156,.25);display:none;align-items:center;
  justify-content:center;z-index:100;pointer-events:none;border:3px dashed var(--acc2);}
#dropHint .box{background:rgba(0,0,0,.75);color:#fff;padding:24px 40px;border-radius:12px;font-size:18px;}
.noCM{padding:30px;color:var(--red);font-family:monospace;}
</style>
</head>
<body>
<div id="tabbar">
  <div id="tabs"></div>
  <div id="tabbarBtns">
    <button class="iconBtn" id="openBtn" title="打开文件 (Ctrl+O)">📂</button>
    <button class="iconBtn" id="shareBtn" title="复制分享链接">📤</button>
    <button class="iconBtn" id="newTabBtn" title="新建文件 (Ctrl+N)">＋</button>
    <button id="runBtn" title="编译并运行全部样例 (F9)">▶ 运行 (F9)</button>
  </div>
</div>
<div id="main">
  <div id="editorWrap"><div id="editor"></div></div>
  <div id="sidePanel">
    <div id="sideHead"><b>测试用例</b><span class="hint">F9 运行 · 拖入 .in/.out 文件可填用例</span></div>
    <div id="fetchRow">
      <input id="fetchUrl" placeholder="题目 URL（AtCoder / Codeforces）" spellcheck="false">
      <button id="fetchBtn">抓取</button>
    </div>
    <div id="caseList"></div>
    <div style="padding:8px;"><button id="addCaseBtn">＋ 添加用例</button></div>
  </div>
</div>
<div id="outputPanel">
  <div id="outTabs">
    <span class="ot active" data-t="run">运行输出</span>
    <span class="ot" data-t="compile">编译信息</span>
    <span class="ot" data-t="input">自定义输入 (Ctrl+Enter 运行)</span>
  </div>
  <div id="outBody">
    <pre id="outRun" class="out show"></pre>
    <pre id="outCompile" class="out"></pre>
    <textarea id="customInput" class="" spellcheck="false" placeholder="在这里输入标准输入，按 Ctrl+Enter 用当前代码运行"></textarea>
  </div>
</div>
<div id="statusbar">
  <span>后端</span><select id="backendSel">
    <option value="auto">自动</option>
    <option value="wandbox">Wandbox</option>
    <option value="godbolt">Compiler Explorer</option>
  </select>
  <span>编译器</span><select id="compilerSel"></select>
  <span>参数</span><input id="argsInput" value="-std=c++20 -O2" spellcheck="false">
  <span>时限</span><input id="timeLimit" value="10000" title="单次运行时限（毫秒），超时自动停止" spellcheck="false">
  <span id="statusText">就绪 — 按 F9 运行全部样例</span>
  <span id="memText" title="编译后端不提供内存统计，故显示为 —">内存 —</span>
  <span id="shortcutHint">F9 运行 · Ctrl+Enter 自定义输入 · Ctrl+S 保存 · Ctrl+N 新建 · Ctrl+W 关闭 · Ctrl+O 打开 · 拖拽文件打开</span>
</div>
<div id="dropHint"><div class="box">📄 松开以打开文件（自动新建标签）</div></div>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="caseFileInput" hidden>
<script src="editor.bundle.js"></script>
<script>
"use strict";
/* ============================================================
 * C++20 在线编译器 v2
 * 快捷键: F9 样例 / Ctrl+Enter 自定义输入 / Ctrl+S 保存
 *         Ctrl+N 新建 / Ctrl+W 关闭 / Ctrl+O 打开
 * 拖拽: 代码文件→新标签; .in/.out 文件→填入用例
 * 用例抓取: AtCoder / Codeforces（直连→allorigins 代理兜底）
 * 分享: 复制带代码的 URL 链接
 * 时限: 自定义毫秒数，超时自动中止（防卡死）
 * ============================================================ */
const $ = id => document.getElementById(id);

/* ---------------- 编辑器（CodeMirror 6） ---------------- */
let view = null;
const CM = window.CM;
function makeState(code){
  return CM.EditorState.create({
    doc: code,
    extensions: [
      CM.basicSetup,
      CM.cpp(),
      CM.oneDark,
      CM.EditorView.lineWrapping,
      CM.keymap.of([CM.indentWithTab]),
      CM.highlightSelectionMatches()
    ]
  });
}
function initEditor(){
  const el = $('editor');
  if (!CM){
    el.innerHTML = '<div class="noCM">编辑器组件加载失败（editor.bundle.js 缺失或损坏）</div>';
    return;
  }
  view = new CM.EditorView({ state: makeState(''), parent: el });
  view.dispatch = (tr, ...rest) => {
    const before = view.state.doc.toString();
    CM.EditorView.prototype.dispatch.call(view, tr, ...rest);
    if (view.state.doc.toString() !== before) markDirty();
  };
}

/* ---------------- 标签管理 ---------------- */
let tabs = [];
let activeTabId = null;
let idSeq = 1;
function newTab(name, code){
  const id = 't' + (idSeq++);
  const tab = { id, name: name || 'untitled.cpp', code: code || '', state: null, dirty: false };
  tabs.push(tab);
  switchTab(id);
  return id;
}
function getTab(id){ return tabs.find(t => t.id === id); }
function currentTab(){ return getTab(activeTabId); }
function switchTab(id){
  const tab = getTab(id);
  if (!tab) return;
  if (currentTab() && view) currentTab().state = view.state;
  activeTabId = id;
  if (view) view.setState(tab.state || makeState(tab.code));
  renderTabbar();
}
function closeTab(id){
  const i = tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  tabs.splice(i, 1);
  if (activeTabId === id){
    activeTabId = tabs.length ? tabs[Math.min(i, tabs.length - 1)].id : null;
    if (activeTabId){
      const t = getTab(activeTabId);
      if (view) view.setState(t.state || makeState(t.code));
    } else if (view) view.setState(makeState(''));
  }
  renderTabbar();
}
function renameTab(id, name){
  const t = getTab(id);
  if (t){ t.name = name || t.name; renderTabbar(); }
}
function markDirty(){
  const t = currentTab();
  if (t){ t.dirty = true; scheduleSave(); renderTabbar(); }
}
function renderTabbar(){
  const bar = $('tabs');
  bar.innerHTML = '';
  for (const t of tabs){
    const d = document.createElement('div');
    d.className = 'tab' + (t.id === activeTabId ? ' active' : '') + (t.dirty ? ' dirty' : '');
    const dot = document.createElement('span'); dot.className = 'dot';
    const nm = document.createElement('span'); nm.className = 'tname'; nm.textContent = t.name;
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕';
    x.title = '关闭';
    x.addEventListener('click', e => { e.stopPropagation(); closeTab(t.id); });
    d.appendChild(dot); d.appendChild(nm); d.appendChild(x);
    d.addEventListener('click', () => switchTab(t.id));
    d.addEventListener('dblclick', () => {
      const name = prompt('重命名文件：', t.name);
      if (name && name.trim()) renameTab(t.id, name.trim());
    });
    bar.appendChild(d);
  }
}
function getCode(){
  const t = currentTab();
  if (!t) return '';
  return view ? view.state.doc.toString() : t.code;
}
function setCode(code){
  const t = currentTab();
  if (!t) return;
  if (view) view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: code } });
  else t.code = code;
}

/* ---------------- 文件读取 ---------------- */
function readFileText(file, cb, errCb){
  const r = new FileReader();
  r.onload = () => cb(String(r.result || ''));
  r.onerror = () => (errCb ? errCb() : cb(''));
  r.readAsText(file);
}
function openFiles(fileList){
  const files = Array.from(fileList || []);
  for (const f of files){
    readFileText(f, txt => newTab(f.name, txt), () => setStatus('⚠ 读取文件失败: ' + f.name));
  }
}

/* ---------------- 测试用例 ---------------- */
let cases = [];
function addCase(input, expected){
  cases.push({ input: input || '', expected: expected || '', result: null, actual: '', time: null });
  renderCases();
}
function removeCase(i){
  cases.splice(i, 1);
  renderCases();
}
function renderCases(){
  const list = $('caseList');
  list.innerHTML = '';
  cases.forEach((c, i) => {
    const box = document.createElement('div');
    box.className = 'caseBox';
    box.dataset.idx = i;
    const head = document.createElement('div'); head.className = 'caseHead';
    const nm = document.createElement('span'); nm.className = 'cname'; nm.textContent = '用例 ' + (i + 1);
    const res = document.createElement('span');
    res.className = 'res' + (c.result ? ' ' + c.result : '');
    const tTxt = c.time != null ? ' · ' + c.time + 'ms' : '';
    res.textContent = c.result === 'pass' ? '✓ 通过' + tTxt : c.result === 'fail' ? '✗ 失败' + tTxt : c.result === 'tle' ? '⏱ 超时' + tTxt : c.result === 'run' ? '⏳ 运行中' : '';
    const del = document.createElement('button'); del.className = 'delCase'; del.textContent = '✕'; del.title = '删除用例';
    del.addEventListener('click', () => removeCase(i));
    head.appendChild(nm); head.appendChild(res); head.appendChild(del);
    const l1 = document.createElement('label'); l1.textContent = '输入';
    const inpRow = document.createElement('div'); inpRow.className = 'inpRow';
    const inp = document.createElement('textarea'); inp.value = c.input; inp.spellcheck = false;
    inp.className = 'caseIn';
    inp.addEventListener('input', () => { c.input = inp.value; c.result = null; c.time = null; res.className = 'res'; res.textContent = ''; scheduleSave(); });
    const upIn = document.createElement('button'); upIn.className = 'upBtn'; upIn.textContent = '上传';
    upIn.title = '上传本地输入文件';
    upIn.addEventListener('click', () => { caseUploadTarget = { i: i, field: 'input' }; $('caseFileInput').click(); });
    inpRow.appendChild(inp); inpRow.appendChild(upIn);
    const l2 = document.createElement('label'); l2.textContent = '期望输出';
    const expRow = document.createElement('div'); expRow.className = 'inpRow';
    const exp = document.createElement('textarea'); exp.value = c.expected; exp.spellcheck = false;
    exp.className = 'caseExp';
    exp.addEventListener('input', () => { c.expected = exp.value; c.result = null; c.time = null; res.className = 'res'; res.textContent = ''; scheduleSave(); });
    const upOut = document.createElement('button'); upOut.className = 'upBtn'; upOut.textContent = '上传';
    upOut.title = '上传本地期望输出文件';
    upOut.addEventListener('click', () => { caseUploadTarget = { i: i, field: 'expected' }; $('caseFileInput').click(); });
    expRow.appendChild(exp); expRow.appendChild(upOut);
    const act = document.createElement('pre'); act.className = 'actual';
    act.textContent = c.actual ? ('实际输出：\n' + c.actual) : '';
    if (c.result === 'fail' && c.actual) act.classList.add('show');
    box.appendChild(head); box.appendChild(l1); box.appendChild(inpRow);
    box.appendChild(l2); box.appendChild(expRow); box.appendChild(act);
    list.appendChild(box);
  });
}
let caseUploadTarget = null;
$('caseFileInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f && caseUploadTarget){
    const tgt = caseUploadTarget;
    readFileText(f, txt => {
      const c = cases[tgt.i];
      if (c){ c[tgt.field] = txt; renderCases(); scheduleSave(); }
    }, () => setStatus('⚠ 读取文件失败'));
  }
  caseUploadTarget = null;
  e.target.value = '';
});

/* ---------------- 用例抓取（AtCoder / Codeforces） ---------------- */
function decodeEntities(s){
  return String(s || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/&#x([0-9a-fA-F]+);/g, (m, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&nbsp;/g, ' ').replace(/&minus;/g, '-').replace(/&times;/g, 'x');
}
function parseAtCoder(html){
  const ins = [...html.matchAll(/入力例\s*\d+\s*<\/h3>\s*<pre[^>]*>([\s\S]*?)<\/pre>/g)].map(m => decodeEntities(m[1]).trim());
  const outs = [...html.matchAll(/出力例\s*\d+\s*<\/h3>\s*<pre[^>]*>([\s\S]*?)<\/pre>/g)].map(m => decodeEntities(m[1]).trim());
  const n = Math.min(ins.length, outs.length);
  const out = [];
  for (let i = 0; i < n; i++) out.push({ input: ins[i], expected: outs[i] });
  return out;
}
function parseCF(html){
  const re = /<div class="input"><pre>([\s\S]*?)<\/pre><\/div>\s*<div class="output"><pre>([\s\S]*?)<\/pre><\/div>/g;
  const out = [];
  let m;
  while ((m = re.exec(html))) out.push({ input: decodeEntities(m[1]).trim(), expected: decodeEntities(m[2]).trim() });
  return out;
}
function parseGeneric(html){
  const reIn = /(?:样例输入|Sample Input|示例输入)\s*\d*\s*<\/?[^>]*>\s*<pre[^>]*>([\s\S]*?)<\/pre>/gi;
  const reOut = /(?:样例输出|Sample Output|示例输出)\s*\d*\s*<\/?[^>]*>\s*<pre[^>]*>([\s\S]*?)<\/pre>/gi;
  const ins = [...html.matchAll(reIn)].map(m => decodeEntities(m[1]).trim());
  const outs = [...html.matchAll(reOut)].map(m => decodeEntities(m[1]).trim());
  const n = Math.min(ins.length, outs.length);
  const out = [];
  for (let i = 0; i < n; i++) out.push({ input: ins[i], expected: outs[i] });
  return out;
}
async function fetchText(url){
  try {
    const r = await fetch(url, { headers: { 'Accept': 'text/html' } });
    if (r.ok){ const t = await r.text(); if (t && t.length > 500) return { text: t, via: '直连' }; }
  } catch (e) {}
  try {
    const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
    if (r.ok){ const t = await r.text(); if (t && t.length > 500) return { text: t, via: '代理' }; }
  } catch (e) {}
  return null;
}
async function fetchCases(){
  const url = $('fetchUrl').value.trim();
  if (!url){ setStatus('⚠ 请输入题目 URL'); return; }
  const btn = $('fetchBtn');
  btn.disabled = true;
  setStatus('抓取题目 ' + url + ' …');
  const got = await fetchText(url);
  btn.disabled = false;
  if (!got){ setStatus('⚠ 抓取失败：网站不可达或不允许跨域'); return; }
  let parsed = [];
  if (/atcoder\.jp/i.test(url)) parsed = parseAtCoder(got.text);
  else if (/codeforces\.com/i.test(url)) parsed = parseCF(got.text);
  else parsed = parseGeneric(got.text);
  if (!parsed.length){ setStatus('⚠ 未能提取样例（站点可能改版/需登录）；' + got.via); return; }
  if (cases.length && !confirm('已有 ' + cases.length + ' 个用例，是否替换为抓取到的 ' + parsed.length + ' 个样例？')){
    setStatus('已取消，未替换'); return;
  }
  cases = parsed.map(x => ({ input: x.input, expected: x.expected, result: null, actual: '', time: null }));
  renderCases();
  scheduleSave();
  setStatus('✓ 抓取到 ' + cases.length + ' 个样例（' + got.via + '）');
}

/* ---------------- 编译后端 ---------------- */
const WANDBOX_COMPILERS = ['gcc-head', 'gcc-13.2.0', 'gcc-12.3.0', 'gcc-11.4.0', 'clang-head', 'clang-18.1.0'];
function fillCompilers(){
  const sel = $('compilerSel');
  sel.innerHTML = '';
  for (const c of WANDBOX_COMPILERS){
    const o = document.createElement('option');
    o.value = c;
    o.textContent = c === 'gcc-head' ? 'GCC 最新 (C++20/23)' : c === 'clang-head' ? 'Clang 最新 (C++20)' : c;
    sel.appendChild(o);
  }
}
function backendOf(){
  const b = $('backendSel').value;
  return b === 'auto' ? null : b;
}
async function runWandbox(code, stdin, compiler, args, signal){
  const r = await fetch('https://wandbox.org/api/compile.json', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0 Safari/537.36' },
    body: JSON.stringify({ code, compiler, stdin, options: args }),
    signal
  });
  let j;
  try {
    j = await r.json();
  } catch (e) {
    const txt = await r.text().catch(() => '');
    return { ok: false, kind: 'net', text: 'Wandbox 返回异常(HTTP ' + r.status + '): ' + txt.slice(0, 120) };
  }
  if (j.status !== '0'){
    return { ok: false, kind: 'compile', text: (j.compiler_error || '') + (j.compiler_message || '') };
  }
  const out = (j.program_output != null && j.program_output !== '') ? j.program_output : (j.program_message || '');
  const err = (j.program_error || '').trim();
  return { ok: true, text: out || '', err: err };
}
let godboltCompilerId = null;
async function godboltId(){
  if (godboltCompilerId) return godboltCompilerId;
  try {
    const r = await fetch('https://godbolt.org/api/compilers/c++', { headers: { 'Accept': 'application/json' } });
    const list = await r.json();
    const g = list.find(c => /^GCC.*12\.2/i.test(c.name)) || list.find(c => /^GCC.*13/i.test(c.name)) || list.find(c => /^GCC/i.test(c.name));
    godboltCompilerId = g ? g.id : 'g122';
  } catch (e) {
    godboltCompilerId = 'g122';
  }
  return godboltCompilerId;
}
async function runGodbolt(code, stdin, args, signal){
  const cid = await godboltId();
  const r = await fetch('https://godbolt.org/api/compiler/' + cid + '/compile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0 Safari/537.36' },
    body: JSON.stringify({
      source: code,
      options: { userArguments: args || '-std=c++20 -O2', executeParameters: { stdin, args: [] } },
      filters: { execute: true, labels: false, directives: false, commentOnly: false, trim: false, intel: true }
    }),
    signal
  });
  if (!r.ok){
    const txt = await r.text().catch(() => '');
    return { ok: false, kind: 'net', text: 'Compiler Explorer 异常(HTTP ' + r.status + '): ' + txt.slice(0, 120) };
  }
  let j;
  try {
    j = await r.json();
  } catch (e) {
    return { ok: false, kind: 'net', text: 'Compiler Explorer 返回异常' };
  }
  const seg = a => (a || []).map(s => s.text || '').join('');
  const stdout = seg(j.stdout);
  const stderr = seg(j.stderr);
  if (j.code !== 0) return { ok: false, kind: 'compile', text: stderr || '编译失败 (code ' + j.code + ')' };
  return { ok: true, text: stdout, err: stderr };
}
function timeLimitMs(){
  const v = parseInt($('timeLimit').value, 10);
  return (v && v > 0) ? v : 10000;
}
async function compileRun(code, stdin, limitMs){
  const args = $('argsInput').value.trim() || '-std=c++20 -O2';
  const compiler = $('compilerSel').value;
  const manual = backendOf();
  const attempts = manual ? [manual] : ['wandbox', 'godbolt'];
  const lim = limitMs || timeLimitMs();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), lim);
  const started = performance.now();
  const msNow = () => Math.round(performance.now() - started);
  let lastErr = null;
  for (const b of attempts){
    try {
      const res = b === 'wandbox' ? await runWandbox(code, stdin, compiler, args, ctl.signal) : await runGodbolt(code, stdin, args, ctl.signal);
      if (ctl.signal.aborted) return { backend: b, ok: false, kind: 'tle', text: '运行超时（> ' + lim + 'ms）', ms: msNow() };
      clearTimeout(timer);
      if (res.ok) return { backend: b, ...res, ms: msNow() };
      lastErr = { backend: b, ...res, ms: msNow() };
    } catch (e){
      if (ctl.signal.aborted) return { backend: b, ok: false, kind: 'tle', text: '运行超时（> ' + lim + 'ms）', ms: msNow() };
      lastErr = { backend: b, ok: false, kind: 'net', text: '网络错误: ' + e.message, ms: msNow() };
    }
  }
  clearTimeout(timer);
  return { backend: lastErr.backend, ...lastErr };
}
function norm(s){ return String(s || '').replace(/\r/g, '').replace(/\s+$/g, '').replace(/^\s+/g, ''); }

/* ---------------- 运行 ---------------- */
let running = false;
async function runAll(){
  if (running) return;
  const code = getCode();
  if (!code.trim()){ setStatus('⚠ 代码为空'); return; }
  if (!cases.length){ setStatus('⚠ 没有测试用例 — 添加用例或输入题目 URL 抓取'); return; }
  running = true;
  $('runBtn').disabled = true;
  cases.forEach(c => { c.result = null; c.actual = ''; c.time = null; });
  renderCases();
  const t0 = performance.now();
  setStatus('编译并运行样例…（时限 ' + timeLimitMs() + 'ms）');
  let pass = 0, aborted = false, timedOut = 0;
  for (let i = 0; i < cases.length && !aborted; i++){
    const c = cases[i];
    c.result = 'run';
    renderCases();
    let res;
    try {
      res = await compileRun(code, c.input || '');
    } catch (e){
      res = { backend: '?', ok: false, kind: 'net', text: '运行异常: ' + e.message, ms: 0 };
    }
    if (res.kind === 'tle'){ c.result = 'tle'; c.time = res.ms; c.actual = res.text; timedOut++; }
    else if (res.kind === 'compile'){ showCompile(res); setStatus('编译失败 (' + res.backend + ') · ' + res.ms + 'ms'); aborted = true; break; }
    else if (res.kind === 'net'){ c.result = 'fail'; c.time = res.ms; c.actual = '网络错误：' + res.text; }
    else if (res.ok && norm(res.text) === norm(c.expected)){ c.result = 'pass'; c.time = res.ms; pass++; }
    else { c.result = 'fail'; c.time = res.ms; c.actual = res.ok ? (res.text || '(无输出)') + (res.err ? '\n[stderr] ' + res.err : '') : (res.text || '运行错误'); }
    renderCases();
  }
  if (!aborted){
    const ms = Math.round(performance.now() - t0);
    const tleTxt = timedOut ? ' · 超时 ' + timedOut : '';
    setStatus('完成: 通过 ' + pass + '/' + cases.length + tleTxt + ' · 总耗时 ' + ms + 'ms');
    showRun(cases.map((c, i) => '用例 ' + (i + 1) + ': ' + (c.result === 'pass' ? '✓ 通过' : c.result === 'tle' ? '⏱ 超时' : '✗ 失败') + (c.time != null ? ' · ' + c.time + 'ms' : '')).join('\n'));
  }
  running = false;
  $('runBtn').disabled = false;
}
async function runCustom(){
  const code = getCode();
  const stdin = $('customInput').value;
  if (!code.trim()){ setStatus('⚠ 代码为空'); return; }
  setStatus('运行中…（时限 ' + timeLimitMs() + 'ms）');
  const t0 = performance.now();
  const res = await compileRun(code, stdin);
  const ms = Math.round(performance.now() - t0);
  if (res.kind === 'tle'){ showRun('⏱ 运行超时（> ' + timeLimitMs() + 'ms）'); setStatus('超时 · ' + ms + 'ms'); return; }
  if (!res.ok){
    showCompile(res);
    setStatus('编译失败 (' + res.backend + ') · ' + ms + 'ms');
    return;
  }
  showCompile({ ok: true, text: '' });
  showRun((res.text || '(无输出)') + (res.err ? '\n[stderr] ' + res.err : ''));
  setStatus('完成 (' + res.backend + ') · ' + ms + 'ms');
}
function showCompile(res){
  $('outCompile').textContent = res.ok ? '(无编译信息)' : res.text;
  $('outCompile').className = 'out show' + (res.ok ? '' : ' err');
  $('outRun').className = 'out';
  $('customInput').className = '';
  activateOutTab('compile');
}
function showRun(text){
  $('outRun').textContent = text || '(无输出)';
  $('outRun').className = 'out show';
  $('outCompile').className = 'out';
  $('customInput').className = '';
  activateOutTab('run');
}
function activateOutTab(t){
  document.querySelectorAll('.ot').forEach(el => el.classList.toggle('active', el.dataset.t === t));
}
function setStatus(s){ $('statusText').textContent = s; }

/* ---------------- 分享 ---------------- */
function buildShareUrl(){
  const t = currentTab();
  if (!t) return '';
  const data = { n: t.name, c: getCode(), s: cases.map(x => ({ i: x.input, o: x.expected })) };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const b64url = b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return location.origin + location.pathname + '?share=' + encodeURIComponent(b64url);
}
function shareCode(){
  const url = buildShareUrl();
  if (!url) return;
  copyText(url);
  setStatus('✓ 分享链接已复制');
}
function copyText(txt){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).catch(() => fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}
function loadShare(){
  let s = null;
  try { s = new URLSearchParams(location.search).get('share'); } catch (e) {}
  if (!s) return;
  try {
    const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
    const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
    const data = JSON.parse(decodeURIComponent(escape(atob(padded))));
    const name = data.n || 'shared.cpp';
    const code = data.c || '';
    if (tabs.length && !getCode().trim()){
      renameTab(activeTabId, name);
      setCode(code);
    } else {
      newTab(name, code);
    }
    if (Array.isArray(data.s)){
      cases = data.s.map(x => ({ input: x.i || '', expected: x.o || '', result: null, actual: '', time: null }));
      renderCases();
    }
    setStatus('✓ 已加载分享的代码与用例');
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  } catch (e) {
    setStatus('分享链接无效');
  }
}

/* ---------------- 快捷键 ---------------- */
function handleKeys(e){
  const k = e.key;
  const ctrl = e.ctrlKey || e.metaKey;
  if (k === 'F9'){ e.preventDefault(); runAll(); return; }
  if (ctrl && k === 'Enter'){ e.preventDefault(); activateOutTab('input'); $('customInput').className = 'show'; runCustom(); return; }
  if (ctrl && (k === 's' || k === 'S')){ e.preventDefault(); saveFile(); return; }
  if (ctrl && (k === 'n' || k === 'N')){ e.preventDefault(); newTab('untitled' + (idSeq) + '.cpp'); return; }
  if (ctrl && (k === 'w' || k === 'W')){ e.preventDefault(); closeTab(activeTabId); return; }
  if (ctrl && (k === 'o' || k === 'O')){ e.preventDefault(); $('fileInput').click(); return; }
}
window.addEventListener('keydown', handleKeys);

/* ---------------- 文件保存 / 拖拽 ---------------- */
function saveFile(){
  const t = currentTab();
  if (!t) return;
  const blob = new Blob([getCode()], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = t.name.replace(/[\\/:*?"<>|]/g, '_');
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  t.dirty = false;
  renderTabbar();
}
$('fileInput').addEventListener('change', e => { openFiles(e.target.files); e.target.value = ''; });
/* 拖拽：document 捕获阶段监听，规避编辑器对拖拽事件的拦截 */
function hasFiles(e){
  const t = e.dataTransfer;
  return t && Array.from(t.types || []).indexOf('Files') >= 0;
}
document.addEventListener('dragover', e => {
  if (hasFiles(e)){ e.preventDefault(); $('dropHint').style.display = 'flex'; }
}, true);
document.addEventListener('dragleave', e => {
  if (hasFiles(e)){ e.preventDefault(); $('dropHint').style.display = 'none'; }
}, true);
document.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  $('dropHint').style.display = 'none';
  const files = Array.from(e.dataTransfer.files || []);
  if (!files.length) return;
  // 拖到某个用例框上 → 填入该用例（.in→输入，.out→期望）
  const tgt = e.target;
  const card = tgt && tgt.closest ? tgt.closest('.caseBox') : null;
  if (card){
    const idx = parseInt(card.dataset.idx, 10);
    const field = tgt.classList && tgt.classList.contains('caseExp') ? 'expected' : 'input';
    if (!isNaN(idx) && cases[idx]){
      readFileText(files[0], txt => { cases[idx][field] = txt; renderCases(); scheduleSave(); });
      return;
    }
  }
  openFiles(files);
}, true);

/* ---------------- 持久化 ---------------- */
const LS_KEY = 'cppPlayground.v1';
let saveTimer = null;
function scheduleSave(){
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}
function doSave(){
  try {
    const data = {
      tabs: tabs.map(t => ({ name: t.name, code: t.code })),
      active: activeTabId,
      cases: cases,
      backend: $('backendSel').value,
      compiler: $('compilerSel').value,
      args: $('argsInput').value,
      limit: $('timeLimit').value
    };
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch (e) {}
}
function doLoad(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.tabs) && d.tabs.length){
      tabs = [];
      for (const t of d.tabs) newTab(t.name, t.code || '');
      if (d.active && getTab(d.active)) switchTab(d.active);
    }
    if (Array.isArray(d.cases)) cases = d.cases;
    if (d.backend) $('backendSel').value = d.backend;
    if (d.compiler && WANDBOX_COMPILERS.indexOf(d.compiler) >= 0) $('compilerSel').value = d.compiler;
    if (d.args) $('argsInput').value = d.args;
    if (d.limit) $('timeLimit').value = d.limit;
  } catch (e) {}
}

/* ---------------- 示例代码 ---------------- */
const SAMPLE = `#include <bits/stdc++.h>
#include <ranges>
using namespace std;

int main() {
    ios::sync_with_stdio(false);
    cin.tie(nullptr);

    int n;
    cin >> n;
    vector<int> a(n);
    for (auto& x : a) cin >> x;

    // C++20: views 管道 + lambda
    auto s = a
        | views::filter([](int x) { return x % 2 == 0; })
        | views::transform([](int x) { return x * x; });

    long long sum = 0;
    for (int x : s) sum += x;
    cout << sum << '\\n';
}
`;
const SAMPLE_CASES = [
  { input: '5\n1 2 3 4 5', expected: '20' },
  { input: '4\n2 4 6 8', expected: '120' }
];

/* ---------------- 初始化 ---------------- */
function init(){
  initEditor();
  fillCompilers();
  doLoad();
  if (!tabs.length){
    newTab('main.cpp', SAMPLE);
    cases = SAMPLE_CASES.map(c => ({ input: c.input, expected: c.expected, result: null, actual: '', time: null }));
    markDirty();
  }
  renderCases();
  renderTabbar();
  $('newTabBtn').addEventListener('click', () => newTab('untitled' + (idSeq) + '.cpp'));
  $('openBtn').addEventListener('click', () => $('fileInput').click());
  $('shareBtn').addEventListener('click', shareCode);
  $('runBtn').addEventListener('click', runAll);
  $('addCaseBtn').addEventListener('click', () => addCase('', ''));
  $('fetchBtn').addEventListener('click', fetchCases);
  $('fetchUrl').addEventListener('keydown', e => { if (e.key === 'Enter') fetchCases(); });
  $('backendSel').addEventListener('change', scheduleSave);
  $('compilerSel').addEventListener('change', scheduleSave);
  $('argsInput').addEventListener('input', scheduleSave);
  $('timeLimit').addEventListener('input', scheduleSave);
  document.querySelectorAll('.ot').forEach(el => {
    el.addEventListener('click', () => {
      const t = el.dataset.t;
      activateOutTab(t);
      $('outRun').className = 'out' + (t === 'run' ? ' show' : '');
      $('outCompile').className = 'out' + (t === 'compile' ? ' show' : '');
      $('customInput').className = t === 'input' ? 'show' : '';
    });
  });
  loadShare();
}
window.addEventListener('load', init);
/* 调试钩子（供测试） */
window.__app = () => ({
  tabCount: tabs.length, activeId: activeTabId, caseCount: cases.length,
  codeLen: getCode().length, backend: $('backendSel').value, running
});
window.__runAll = runAll;
window.__runCustom = runCustom;
window.__newTab = newTab;
window.__openFiles = openFiles;
window.__cases = () => cases;
window.__tabs = () => tabs;
window.__setCode = setCode;
window.__buildShareUrl = buildShareUrl;
window.__parsers = { parseAtCoder, parseCF, parseGeneric, decodeEntities };
window.__fetchCases = fetchCases;
window.__setUploadTarget = (i, field) => { caseUploadTarget = { i, field }; };
</script>
